<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SIS Attendance | Sapporo International School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root { --sis-green: #0b7b3e; --sis-green-light: #e8f5ee; --sis-green-dark: #06582b; --sis-gold: #c9a84c; }
        body { background: #f5f7f6; min-height: 100vh; padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; }
        .header { background: var(--sis-green); color: white; padding: 25px 20px; border-radius: 24px 24px 0 0; text-align: center; }
        .header .logo { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
        .header .logo i { color: var(--sis-gold); }
        .header .subtitle { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
        .card { background: white; border-radius: 0 0 24px 24px; padding: 24px 20px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .scanner-wrapper { background: #1a1a2e; border-radius: 20px; overflow: hidden; margin-bottom: 20px; position: relative; min-height: 280px; }
        #reader { width: 100%; min-height: 280px; }
        #reader video { border-radius: 20px; width: 100%; height: auto; }
        .scanner-placeholder { color: white; text-align: center; padding: 40px 20px; }
        .scanner-placeholder i { font-size: 3rem; display: block; margin-bottom: 12px; opacity: 0.6; }
        .scanner-placeholder .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--sis-gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 10px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .camera-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .cam-btn { flex: 1; padding: 10px; border: 2px solid #e2e8f0; border-radius: 40px; background: white; color: #4a5568; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .cam-btn:hover { border-color: var(--sis-green); color: var(--sis-green); }
        .cam-btn.active { border-color: var(--sis-green); background: var(--sis-green-light); color: var(--sis-green); }
        .student-info { background: var(--sis-green-light); border-radius: 16px; padding: 16px; margin-bottom: 20px; display: none; border-left: 4px solid var(--sis-green); }
        .student-info.show { display: block; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .student-info .name { font-size: 1.2rem; font-weight: 700; color: var(--sis-green-dark); }
        .student-info .details { font-size: 0.85rem; color: #4a5568; margin-top: 4px; }
        .student-info .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-top: 8px; }
        .status-badge.in { background: var(--sis-green); color: white; }
        .status-badge.out { background: #e74c3c; color: white; }
        .status-badge.pending { background: #f39c12; color: white; }
        .status-badge.complete { background: #2ecc71; color: white; }
        .action-buttons { display: flex; gap: 12px; margin-bottom: 16px; }
        .action-buttons .btn { flex: 1; padding: 14px; border: none; border-radius: 40px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .action-buttons .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-in { background: var(--sis-green); color: white; }
        .btn-in:hover:not(:disabled) { background: var(--sis-green-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(11, 123, 62, 0.3); }
        .btn-out { background: #e74c3c; color: white; }
        .btn-out:hover:not(:disabled) { background: #c0392b; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(231, 76, 60, 0.3); }
        .btn-manual { background: #f0f2f5; color: #4a5568; border: 2px solid #e2e8f0 !important; font-size: 0.85rem !important; }
        .btn-manual:hover { background: #e2e8f0; }
        .manual-panel { display: none; background: #f8fafc; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .manual-panel.show { display: block; }
        .manual-panel input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 40px; font-size: 1rem; outline: none; transition: 0.2s; }
        .manual-panel input:focus { border-color: var(--sis-green); box-shadow: 0 0 0 3px rgba(11, 123, 62, 0.1); }
        .manual-panel .manual-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .manual-panel .manual-buttons .btn { flex: 1; padding: 10px; border: none; border-radius: 40px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 14px 28px; border-radius: 40px; color: white; font-weight: 600; font-size: 0.95rem; opacity: 0; transition: all 0.3s ease; z-index: 1000; max-width: 90%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--sis-green); }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #3498db; }
        .records { margin-top: 20px; }
        .records h3 { font-size: 0.9rem; color: #4a5568; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .records h3 button { background: none; border: none; color: var(--sis-green); cursor: pointer; font-weight: 600; }
        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #f8fafc; border-radius: 12px; margin-bottom: 6px; border-left: 4px solid var(--sis-green); font-size: 0.85rem; }
        .record-item .record-name { font-weight: 600; }
        .record-item .record-time { color: #718096; font-size: 0.75rem; }
        .record-item .record-type { font-weight: 600; font-size: 0.75rem; padding: 2px 10px; border-radius: 20px; }
        .record-type.in { background: var(--sis-green-light); color: var(--sis-green); }
        .record-type.out { background: #fde8e8; color: #e74c3c; }
        .empty-records { text-align: center; color: #a0aec0; padding: 20px; font-size: 0.85rem; }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(4px); }
        .loading-overlay.show { display: flex; }
        .loading-box { background: white; padding: 30px 40px; border-radius: 24px; text-align: center; }
        .loading-box .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid var(--sis-green); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
        .loading-box p { color: #4a5568; font-weight: 500; }
        @media (max-width: 500px) { .header { padding: 20px; } .header .logo { font-size: 1.5rem; } .card { padding: 18px 16px; } .action-buttons .btn { font-size: 0.9rem; padding: 12px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">SIS Attendance</div>
        <div class="subtitle">Sapporo International School</div>
    </div>
    
    <div class="card">
        <div class="scanner-wrapper">
            <div id="reader">
                <div class="scanner-placeholder">
                    <i class="fas fa-camera"></i>
                    <div class="spinner"></div>
                    <p>Starting camera...</p>
                    <p style="font-size:0.75rem; opacity:0.6; margin-top:4px;">Allow camera access when prompted</p>
                </div>
            </div>
        </div>
        
        <div class="camera-controls">
            <button id="switchBackBtn" class="cam-btn active"><i class="fas fa-camera"></i> Back</button>
            <button id="switchFrontBtn" class="cam-btn"><i class="fas fa-camera-retro"></i> Front</button>
            <button id="restartCamBtn" class="cam-btn" style="border-color: var(--sis-green); color: var(--sis-green);"><i class="fas fa-sync-alt"></i> Restart</button>
        </div>
        
        <div id="studentInfo" class="student-info">
            <div class="name" id="studentName">—</div>
            <div class="details" id="studentDetails">ID: — | Grade: —</div>
            <div>
                <span class="status-badge pending" id="statusBadge">⏳ Checking...</span>
            </div>
        </div>
        
        <div class="action-buttons">
            <button id="btnIn" class="btn btn-in" disabled><i class="fas fa-sign-in-alt"></i> IN</button>
            <button id="btnOut" class="btn btn-out" disabled><i class="fas fa-sign-out-alt"></i> OUT</button>
        </div>
        
        <button id="toggleManualBtn" class="btn btn-manual" style="width:100%;"><i class="fas fa-keyboard"></i> Manual Entry</button>
        
        <div id="manualPanel" class="manual-panel">
            <input type="text" id="manualStudentId" placeholder="Enter Student ID (e.g., SIS-001)">
            <div class="manual-buttons">
                <button id="manualInBtn" class="btn btn-in" style="flex:1;">IN</button>
                <button id="manualOutBtn" class="btn btn-out" style="flex:1;">OUT</button>
            </div>
        </div>
        
        <div class="records">
            <h3>
                <span><i class="fas fa-clock"></i> Today's Records</span>
                <button id="clearRecordsBtn"><i class="fas fa-trash-alt"></i> Clear</button>
            </h3>
            <div id="recordsList">
                <div class="empty-records">No records yet today</div>
            </div>
        </div>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box"><div class="spinner"></div><p id="loadingMessage">Processing...</p></div>
</div>
<div id="toast" class="toast"></div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygLumG86lhFRecOUw4M__-DzpRQYBoPV-phFXzeYNoMjzZDo9OzWrCxDVRQ1b_9PsGHg/exec";
    
    let students = [];
    let attendanceRecords = [];
    let selectedStudent = null;
    let isProcessing = false;
    let scanner = null;
    let isScanning = false;
    let currentCamera = "environment";
    
    const $ = id => document.getElementById(id);
    const toast = $('toast');
    const loadingOverlay = $('loadingOverlay');
    const loadingMessage = $('loadingMessage');
    const studentInfo = $('studentInfo');
    const studentName = $('studentName');
    const studentDetails = $('studentDetails');
    const statusBadge = $('statusBadge');
    const btnIn = $('btnIn');
    const btnOut = $('btnOut');
    const recordsList = $('recordsList');
    const manualPanel = $('manualPanel');
    const manualStudentId = $('manualStudentId');
    const reader = $('reader');
    
    function showToast(message, type = 'success') {
        toast.textContent = message;
        toast.className = 'toast ' + type + ' show';
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    function showLoading(message) { loadingMessage.textContent = message; loadingOverlay.classList.add('show'); }
    function hideLoading() { loadingOverlay.classList.remove('show'); }
    
    async function apiCall(action, params = {}) {
        let url = `${GOOGLE_SCRIPT_URL}?action=${action}&t=${Date.now()}`;
        for (const [key, value] of Object.entries(params)) {
            url += `&${encodeURIComponent(key)}=${encodeURIComponent(value)}`;
        }
        try {
            const response = await fetch(url);
            const data = await response.json();
            return data;
        } catch (error) {
            console.error("API Error:", error);
            return { status: "error", message: error.message };
        }
    }
    
    async function loadStudents() {
        const result = await apiCall('getStudents');
        if (result.status === 'success' && result.students) {
            students = result.students;
            localStorage.setItem('sis_students', JSON.stringify(students));
            return true;
        }
        const cached = localStorage.getItem('sis_students');
        if (cached) { students = JSON.parse(cached); return true; }
        return false;
    }
    
    async function checkStatus(studentId) {
        const result = await apiCall('checkStatus', { studentId });
        return result;
    }
    
    async function recordAttendance(studentId, type) {
        const student = students.find(s => s.id === studentId);
        if (!student) { showToast('Student not found!', 'error'); return false; }
        
        showLoading(`Recording ${type} for ${student.name}...`);
        
        const status = await checkStatus(studentId);
        if (status.status === 'error') { showToast('Error checking status', 'error'); hideLoading(); return false; }
        
        if (type === 'IN' && status.hasIN) {
            showToast(`⚠️ Already IN at ${status.inTime}`, 'error');
            hideLoading();
            return false;
        }
        if (type === 'OUT' && !status.hasIN) {
            showToast('❌ Must check IN first!', 'error');
            hideLoading();
            return false;
        }
        if (type === 'OUT' && status.hasOUT) {
            showToast(`⚠️ Already OUT at ${status.outTime}`, 'error');
            hideLoading();
            return false;
        }
        
        const result = await apiCall('attendance', {
            studentId: student.id,
            studentName: student.name,
            grade: student.grade,
            studentEmail: student.email,
            phone: student.phone || '',
            type: type
        });
        
        hideLoading();
        
        if (result.status === 'success') {
            const action = type === 'IN' ? 'checked IN' : 'checked OUT';
            showToast(`✅ ${student.name} ${action} successfully!`, 'success');
            
            const today = new Date().toDateString();
            const record = {
                studentId: student.id,
                studentName: student.name,
                grade: student.grade,
                type: type,
                time: new Date().toLocaleTimeString(),
                timestamp: new Date().toISOString(),
                date: today
            };
            
            attendanceRecords = attendanceRecords.filter(r => !(r.studentId === student.id && r.date === today));
            attendanceRecords.unshift(record);
            localStorage.setItem('sis_records', JSON.stringify(attendanceRecords));
            
            renderRecords();
            resetStudentInfo();
            return true;
        } else {
            showToast(`❌ ${result.message || 'Failed to record'}`, 'error');
            return false;
        }
    }
    
    // ============================================
    // STUDENT INFO - FIXED STATUS CHECK
    // ============================================
    function showStudentInfo(student) {
        selectedStudent = student;
        studentInfo.classList.add('show');
        studentName.textContent = student.name;
        studentDetails.textContent = `ID: ${student.id} | Grade: ${student.grade} | ${student.email}`;
        statusBadge.textContent = '⏳ Checking...';
        statusBadge.className = 'status-badge pending';
        btnIn.disabled = true;
        btnOut.disabled = true;
        
        // Check status from server
        checkStatus(student.id).then(status => {
            console.log("Status response:", status);
            
            if (status.status === 'success') {
                // FIX: Check both hasIN and hasOUT flags from server
                const hasIN = status.hasIN || false;
                const hasOUT = status.hasOUT || false;
                const inTime = status.inTime || null;
                const outTime = status.outTime || null;
                
                if (hasIN && hasOUT) {
                    statusBadge.textContent = `✅ Complete (IN: ${inTime} | OUT: ${outTime})`;
                    statusBadge.className = 'status-badge complete';
                    btnIn.disabled = true;
                    btnOut.disabled = true;
                } else if (hasIN) {
                    statusBadge.textContent = `🟡 IN at ${inTime} — Ready for OUT`;
                    statusBadge.className = 'status-badge pending';
                    btnIn.disabled = true;
                    btnOut.disabled = false;
                } else {
                    statusBadge.textContent = '🔴 Not checked IN yet';
                    statusBadge.className = 'status-badge pending';
                    btnIn.disabled = false;
                    btnOut.disabled = true;
                }
            } else {
                statusBadge.textContent = '❌ Error checking status';
                statusBadge.className = 'status-badge out';
                showToast('Error checking student status', 'error');
            }
        }).catch(error => {
            console.error("Status check error:", error);
            statusBadge.textContent = '❌ Connection error';
            statusBadge.className = 'status-badge out';
            showToast('Network error checking status', 'error');
        });
    }
    
    function resetStudentInfo() {
        selectedStudent = null;
        studentInfo.classList.remove('show');
        btnIn.disabled = true;
        btnOut.disabled = true;
    }
    
    // ============================================
    // QR SCAN HANDLER - FIXED TO READ STUDENT ID
    // ============================================
    function handleQRScan(decodedText) {
        console.log("QR Scanned:", decodedText);
        
        // The QR code now contains just the student ID (e.g., "SIS-001")
        // Find the student by ID
        const student = students.find(s => s.id === decodedText);
        
        if (student) {
            showStudentInfo(student);
            showToast(`📸 Scanned: ${student.name}`, 'info');
        } else {
            // Try to parse as JSON (backward compatibility)
            try {
                const data = JSON.parse(decodedText);
                if (data.type === 'attendance' && data.studentId) {
                    const foundStudent = students.find(s => s.id === data.studentId);
                    if (foundStudent) {
                        showStudentInfo(foundStudent);
                        showToast(`📸 Scanned: ${foundStudent.name}`, 'info');
                        return;
                    }
                }
            } catch (e) {
                // Not JSON, continue
            }
            showToast(`❌ Student ID "${decodedText}" not found`, 'error');
        }
    }
    
    // ============================================
    // CAMERA / SCANNER
    // ============================================
    async function initScanner() {
        if (scanner) {
            try { if (isScanning) await scanner.stop(); } catch(e) {}
        }
        
        reader.innerHTML = `
            <div class="scanner-placeholder">
                <i class="fas fa-camera"></i>
                <div class="spinner"></div>
                <p>Starting camera...</p>
            </div>
        `;
        
        scanner = new Html5Qrcode('reader');
        
        try {
            await scanner.start(
                { facingMode: currentCamera },
                { fps: 10, qrbox: { width: 280, height: 280 } },
                handleQRScan,
                () => {}
            );
            isScanning = true;
            
            document.getElementById('switchBackBtn').className = 'cam-btn' + (currentCamera === 'environment' ? ' active' : '');
            document.getElementById('switchFrontBtn').className = 'cam-btn' + (currentCamera === 'user' ? ' active' : '');
            
            showToast('📷 Scanner ready', 'info');
        } catch (err) {
            console.error('Scanner error:', err);
            reader.innerHTML = `
                <div class="scanner-placeholder" style="color: #e74c3c;">
                    <i class="fas fa-exclamation-triangle" style="color: #e74c3c;"></i>
                    <p>Camera error</p>
                    <p style="font-size:0.75rem; opacity:0.8;">${err.message}</p>
                    <button onclick="initScanner()" style="margin-top:10px; padding:8px 20px; border:none; border-radius:20px; background:#0b7b3e; color:white; cursor:pointer;">
                        <i class="fas fa-sync-alt"></i> Retry
                    </button>
                </div>
            `;
            showToast('❌ Camera error', 'error');
        }
    }
    
    async function switchCamera(type) {
        currentCamera = type;
        if (scanner && isScanning) {
            try { await scanner.stop(); } catch(e) {}
            isScanning = false;
        }
        await initScanner();
    }
    
    // ============================================
    // RENDER RECORDS
    // ============================================
    function renderRecords() {
        const today = new Date().toDateString();
        const todayRecords = attendanceRecords.filter(r => r.date === today);
        
        if (todayRecords.length === 0) {
            recordsList.innerHTML = '<div class="empty-records">No records yet today</div>';
            return;
        }
        
        recordsList.innerHTML = todayRecords.map(r => `
            <div class="record-item">
                <div>
                    <span class="record-name">${r.studentName}</span>
                    <span class="record-time">${r.time}</span>
                </div>
                <span class="record-type ${r.type.toLowerCase()}">${r.type}</span>
            </div>
        `).join('');
    }
    
    function loadRecords() {
        const stored = localStorage.getItem('sis_records');
        if (stored) { attendanceRecords = JSON.parse(stored); }
        renderRecords();
    }
    
    // ============================================
    // MANUAL ENTRY
    // ============================================
    function toggleManual() {
        manualPanel.classList.toggle('show');
        const btn = document.getElementById('toggleManualBtn');
        btn.innerHTML = manualPanel.classList.contains('show') 
            ? '<i class="fas fa-chevron-up"></i> Hide Manual Entry' 
            : '<i class="fas fa-keyboard"></i> Manual Entry';
    }
    
    async function manualAction(type) {
        const id = manualStudentId.value.trim();
        if (!id) { showToast('Please enter Student ID', 'error'); return; }
        const student = students.find(s => s.id === id);
        if (!student) { showToast(`❌ Student ${id} not found`, 'error'); return; }
        showStudentInfo(student);
        manualStudentId.value = '';
        manualPanel.classList.remove('show');
        document.getElementById('toggleManualBtn').innerHTML = '<i class="fas fa-keyboard"></i> Manual Entry';
        
        if (type === 'IN') {
            await recordAttendance(student.id, 'IN');
        } else {
            await recordAttendance(student.id, 'OUT');
        }
    }
    
    // ============================================
    // EVENT LISTENERS
    // ============================================
    document.getElementById('switchBackBtn').addEventListener('click', () => switchCamera('environment'));
    document.getElementById('switchFrontBtn').addEventListener('click', () => switchCamera('user'));
    document.getElementById('restartCamBtn').addEventListener('click', initScanner);
    document.getElementById('toggleManualBtn').addEventListener('click', toggleManual);
    document.getElementById('manualInBtn').addEventListener('click', () => manualAction('IN'));
    document.getElementById('manualOutBtn').addEventListener('click', () => manualAction('OUT'));
    document.getElementById('clearRecordsBtn').addEventListener('click', () => {
        attendanceRecords = [];
        localStorage.setItem('sis_records', JSON.stringify(attendanceRecords));
        renderRecords();
        showToast('Records cleared', 'info');
    });
    
    btnIn.addEventListener('click', () => { if (selectedStudent) recordAttendance(selectedStudent.id, 'IN'); });
    btnOut.addEventListener('click', () => { if (selectedStudent) recordAttendance(selectedStudent.id, 'OUT'); });
    
    manualStudentId.addEventListener('keypress', (e) => { if (e.key === 'Enter') manualAction('IN'); });
    
    // ============================================
    // INIT
    // ============================================
    async function init() {
        showLoading('Loading students...');
        await loadStudents();
        loadRecords();
        hideLoading();
        initScanner();
        
        if (students.length === 0) {
            showToast('⚠️ No students found. Please register students first.', 'error');
        } else {
            showToast(`✅ ${students.length} students loaded`, 'success');
        }
    }
    
    init();
    
    window.addEventListener('beforeunload', () => {
        if (scanner && isScanning) { scanner.stop().catch(() => {}); }
    });
</script>
</body>
</html>
